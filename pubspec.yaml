name: unidental
description: "Unidental: unidades dentales de varias marcas para doctores."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icono.png"
  adaptive_icon_background: "#C6F432"
  adaptive_icon_foreground: "assets/icono_frente.png"
  remove_alpha_ios: true
